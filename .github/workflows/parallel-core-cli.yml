name: WB01 Core CLI Candidate

on:
  push:
    branches:
      - parallel/20260925/core-cli
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb01-core-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  WB01_BRANCH: parallel/20260925/core-cli

jobs:
  source:
    name: Freeze source identity
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify dedicated branch and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$WB01_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Validate contract and workflow safety
        run: python3 scripts/ci/parallel-core-cli/verify_contract.py

      - name: Freeze candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          version=$(go run ./tools/release version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'WB01 source: %s %s\n' "$commit" "$version"

  verify:
    name: Contract, Go and real CLI verification
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize verification diagnostics
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-verify"
          mkdir -p "$output"
          cat >"$output/run-metadata.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}"
          }
          EOF

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact source and formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted=$(gofmt -l "${go_files[@]}")
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Validate contract, fixtures and command matrix
        run: python3 scripts/ci/parallel-core-cli/verify_contract.py

      - name: Vet all Go packages
        run: go vet ./...

      - name: Test all Go packages
        run: go test -p 2 ./... -count=1 -timeout=15m

      - name: Race-test changed control paths
        run: >-
          go test -race -p 2
          ./cmd/agentdock
          ./internal/app
          ./internal/runtimeapi
          ./internal/httpx
          ./internal/desktopruntime
          ./internal/activity
          ./internal/permission
          ./internal/insertion
          -count=1 -timeout=12m

      - name: Build real CLI subprocess target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb01-verify/bin"
          go build -trimpath -o "$RUNNER_TEMP/wb01-verify/bin/agentdock" ./cmd/agentdock
          "$RUNNER_TEMP/wb01-verify/bin/agentdock" version --json

      - name: Run authenticated real-process CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb01-verify/mock"
          export WB01_MOCK_TOKEN="wb01-hosted-runner-token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token_file="$RUNNER_TEMP/wb01-mock-token"
          port_file="$RUNNER_TEMP/wb01-verify/mock/endpoint"
          printf '%s\n' "$WB01_MOCK_TOKEN" >"$token_file"
          chmod 600 "$token_file"
          python3 scripts/ci/parallel-core-cli/mock_core.py \
            --port-file "$port_file" \
            >"$RUNNER_TEMP/wb01-verify/mock/server.out" \
            2>"$RUNNER_TEMP/wb01-verify/mock/server.err" &
          mock_pid=$!
          cleanup() {
            kill -TERM "$mock_pid" 2>/dev/null || true
            wait "$mock_pid" 2>/dev/null || true
            rm -f "$token_file"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            [[ -s "$port_file" ]] && break
            kill -0 "$mock_pid"
            sleep 0.1
          done
          test -s "$port_file"
          endpoint=$(cat "$port_file")
          bash scripts/ci/parallel-core-cli/smoke_cli.sh \
            "$RUNNER_TEMP/wb01-verify/bin/agentdock" \
            "$endpoint" \
            "$token_file"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb01-verify-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb01-verify/
          if-no-files-found: warn
          retention-days: 14

  native-candidates:
    name: Native Linux candidate (${{ matrix.arch }})
    needs:
      - source
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize candidate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-linux-${{ matrix.arch }}"
          mkdir -p "$output"
          cat >"$output/run-metadata.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "candidate_arch": "${{ matrix.arch }}"
          }
          EOF

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$WB01_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
          test "$(go run ./tools/release version)" = "${{ needs.source.outputs.version }}"
          test -z "$(git status --porcelain)"

      - name: Install hosted-runner packaging prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build portable, DEB and RPM candidates
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-linux-${{ matrix.arch }}"
          mkdir -p "$output"
          python3 packaging/build-unix-release.py \
            --output "$output" \
            --os linux \
            --arch "${{ matrix.arch }}" \
            --commit "${{ needs.source.outputs.commit }}"
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
          test -z "$(git status --porcelain)"

      - name: Install, inspect and uninstall native packages
        shell: bash
        env:
          AGENTDOCK_NATIVE_ACCEPTANCE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-linux-${{ matrix.arch }}"
          sentinel_dir="$HOME/.agentdock"
          sentinel="$sentinel_dir/wb01-preserve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$sentinel_dir"
          printf 'WB01 existing user data sentinel\n' >"$sentinel"
          sentinel_sha=$(sha256sum "$sentinel" | awk '{print $1}')
          printf '%s\n' "$sentinel_sha" >"$output/home-sentinel.sha256"
          python3 scripts/test/test-linux-native-packages.py \
            --directory "$output" \
            --version "${{ needs.source.outputs.version }}" \
            --commit "${{ needs.source.outputs.commit }}" \
            --arch "${{ matrix.arch }}" \
            2>&1 | tee "$output/native-package-acceptance.log"
          actual_sha=$(sha256sum "$sentinel" | awk '{print $1}')
          test "$actual_sha" = "$sentinel_sha"
          cat >"$output/home-preservation-linux-${{ matrix.arch }}.json" <<EOF
          {
            "relative_path": "~/.agentdock/$(basename "$sentinel")",
            "sha256": "$actual_sha",
            "preserved": true
          }
          EOF

      - name: Verify candidate identities, checksums and acceptance
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-linux-${{ matrix.arch }}"
          sentinel="$HOME/.agentdock/wb01-preserve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sentinel_sha=$(cat "$output/home-sentinel.sha256")
          trap 'rm -f "$sentinel"' EXIT
          python3 scripts/ci/parallel-core-cli/verify_candidate.py \
            --output "$output" \
            --arch "${{ matrix.arch }}" \
            --commit "${{ needs.source.outputs.commit }}" \
            --version "${{ needs.source.outputs.version }}" \
            --home-sentinel "$sentinel" \
            --home-sentinel-sha256 "$sentinel_sha"
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
          test -z "$(git status --porcelain)"

      - name: Upload candidate or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb01-linux-${{ matrix.arch }}-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb01-linux-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  candidate-index:
    name: Verify cross-architecture candidate set
    if: ${{ always() && needs.source.result == 'success' }}
    needs:
      - source
      - native-candidates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize index diagnostics
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-index"
          mkdir -p "$output"
          cat >"$output/run-metadata.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "attempt": "${GITHUB_RUN_ATTEMPT}",
            "native_candidates_result": "${{ needs.native-candidates.result }}"
          }
          EOF

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download candidate-only artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: wb01-linux-*-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb01-candidates

      - name: Verify same source and build candidate index
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wb01-index"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
          if [[ "${{ steps.download.outcome }}" != "success" ]]; then
            printf '%s\n' "candidate artifact download failed or was incomplete" >"$output/incomplete.txt"
            exit 1
          fi
          python3 scripts/ci/parallel-core-cli/index_candidates.py \
            --root "$RUNNER_TEMP/wb01-candidates" \
            --commit "${{ needs.source.outputs.commit }}" \
            --version "${{ needs.source.outputs.version }}" \
            --output "$output/candidate-index.json"
          test -z "$(git status --porcelain)"

      - name: Upload candidate index or diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb01-candidate-index-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb01-index/
          if-no-files-found: warn
          retention-days: 14
