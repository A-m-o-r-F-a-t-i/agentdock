name: WB04 Secure Code Import

on:
  push:
    branches:
      - parallel/20260925/activity
    paths:
      - .github/workflows/wb04-secure-import.yml

permissions:
  contents: read

concurrency:
  group: wb04-secure-import-${{ github.ref }}
  cancel-in-progress: false

env:
  WB04_BRANCH: parallel/20260925/activity
  WB04_BASE_SHA: b367eaab95202873fb213b8713440bf7822878c4
  WB04_TARGET_SHA: c008ea421e768978e22d0948a9eee74f37c335c6
  WB04_BUNDLE_SHA256: 32b82807ad771c71d0d9ddd06dcb7b10633cfd4a2c3378cf48a3aa4c41034323
  WB04_BUNDLE_URL: 'https://reno8-agentdock.tail661595.ts.net/artifacts/public/36eaed10bbcfdb18e20561fdd37078f4/wb04-code-c008ea4.bundle?expires=1790439398&sig=00af726565d376aa840604f230b9e29e71b735428b9fa5811b175128329038e9'

jobs:
  import:
    name: Verify and merge exact WB04 code commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable code bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wb04-import
          test "$GITHUB_REF_NAME" = "$WB04_BRANCH"
          git merge-base --is-ancestor "$WB04_BASE_SHA" HEAD
          curl --fail --location --retry 5 --retry-all-errors "$WB04_BUNDLE_URL" -o /tmp/wb04.bundle
          printf '%s  %s\n' "$WB04_BUNDLE_SHA256" /tmp/wb04.bundle | sha256sum -c -
          git bundle verify /tmp/wb04.bundle
          git fetch /tmp/wb04.bundle refs/wb04/code:refs/remotes/wb04/code
          test "$(git rev-parse refs/remotes/wb04/code)" = "$WB04_TARGET_SHA"
          git merge-base --is-ancestor "$WB04_BASE_SHA" "$WB04_TARGET_SHA"
          git diff --name-only "$WB04_BASE_SHA...$WB04_TARGET_SHA" > dist/wb04-import/changed-files.txt

      - name: Merge exact code history without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit refs/remotes/wb04/code -m 'merge(wb04): import activity status fixes'
          git merge-base --is-ancestor "$WB04_TARGET_SHA" HEAD
          git diff --quiet "$WB04_TARGET_SHA" -- . ':(exclude).github/workflows/wb04-secure-import.yml'
          merged="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$WB04_BRANCH"
          python3 - "$merged" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path('dist/wb04-import/import.json').write_text(json.dumps({
              'lane': '04-activity',
              'bootstrap_sha': os.environ['GITHUB_SHA'],
              'base_sha': os.environ['WB04_BASE_SHA'],
              'target_sha': os.environ['WB04_TARGET_SHA'],
              'remote_merge_sha': sys.argv[1],
              'bundle_sha256': os.environ['WB04_BUNDLE_SHA256'],
              'status': 'passed',
              'force_push': False,
              'production_modified': False,
              'merged_to_main': False,
              'released': False,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload import evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb04-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wb04-import/*
          if-no-files-found: warn
          retention-days: 30
