name: WB03 Insertion Receipt Candidate

on:
  push:
    branches:
      - parallel/20260925/insertion
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character source SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wb03-insertion-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve immutable candidate source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
      - id: identity
        name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$commit" != "${{ inputs.ref }}" ]]; then
            echo "Requested SHA and checked-out SHA differ" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  core:
    name: Core contract (${{ matrix.os }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p dist/wb03
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" | tee dist/wb03/format.log
            exit 1
          fi
          printf 'All tracked Go files are formatted.\n' | tee dist/wb03/format.log
      - name: Run insertion, app, MCP and HTTP contracts
        shell: bash
        run: |
          set -euo pipefail
          go test -json -p 2 ./internal/insertion ./internal/app ./internal/mcp ./internal/httpx -count=1 -timeout=10m | tee dist/wb03/core-tests.jsonl
      - name: Vet candidate packages
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/insertion ./internal/app ./internal/mcp ./internal/httpx 2>&1 | tee dist/wb03/vet.log
      - name: Build CLI without packaging
        shell: bash
        run: |
          set -euo pipefail
          extension=""
          [[ "${{ runner.os }}" == "Windows" ]] && extension=".exe"
          output="dist/wb03/agentdock-wb03-check${extension}"
          go build -o "$output" ./cmd/agentdock
          test -s "$output"
          rm -f "$output"
          printf 'CLI build passed; no candidate binary was retained or uploaded.\n' | tee dist/wb03/build.log
      - name: Check source tree cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          unexpected="$(git status --porcelain --untracked-files=all | grep -v '^?? dist/wb03/' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected test output in source tree:\n%s\n' "$unexpected" | tee dist/wb03/cleanliness.log
            exit 1
          fi
          printf 'Only diagnostics under dist/wb03 were created.\n' | tee dist/wb03/cleanliness.log
      - name: Record immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p dist/wb03
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_COMMIT"
          go_version="$(go version)"
          printf '{"lane":"WB03-insertion","commit":"%s","expected_commit":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s","runner_arch":"%s","go_version":"%s","production_touched":false,"package_published":false}\n' \
            "$commit" "$EXPECTED_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" "$go_version" > dist/wb03/evidence.json
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wb03-insertion-core-${{ runner.os }}-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wb03/*
          if-no-files-found: warn
          retention-days: 30

  race:
    name: Receipt and projection race contracts
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run queue concurrency and receipt races
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wb03
          go test -race -json ./internal/insertion -count=1 -timeout=8m | tee dist/wb03/insertion-race.jsonl
      - name: Run selective projection races
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json ./internal/mcp \
            -run 'Test(ProjectedThirdCallPreservesSupplementBeforeFourthAction|UnintegratedProjectionLosesDisplayButNeverEndsDelivery|ProjectedFailuresNeverFabricateContextCommit|SDKInitializedHostReceiptsAndCapabilityRefusal|BusinessArgumentsCannotDeclareReceiptCapability)$' \
            -count=1 -timeout=8m | tee dist/wb03/projection-race.jsonl
      - name: Record immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p dist/wb03
          printf '{"lane":"WB03-insertion","commit":"%s","run_id":"%s","run_attempt":"%s","runner":"linux-race","production_touched":false,"package_published":false}\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/wb03/evidence.json
          test "$(git rev-parse HEAD)" = "${{ needs.source.outputs.commit }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wb03-insertion-race-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wb03/*
          if-no-files-found: warn
          retention-days: 30

  desktop:
    name: Windows insertion presentation
    needs: source
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Prepare diagnostics
        run: New-Item -ItemType Directory -Force dist/wb03,dist/layout-validation | Out-Null
      - name: Pure insertion presentation contracts
        run: |
          dotnet run --project desktop/windows/control-panel-tests/AgentDock.ControlPanel.Tests.csproj -c Release 2>&1 | Tee-Object -FilePath dist/wb03/desktop-policy.log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop policy contracts failed' }
      - name: Build WPF control panel
        run: |
          dotnet build desktop/windows/control-panel/AgentDock.ControlPanel.csproj -c Release 2>&1 | Tee-Object -FilePath dist/wb03/wpf-build.log
          if ($LASTEXITCODE -ne 0) { throw 'WPF build failed' }
      - name: Offscreen insertion timeline contract
        run: |
          dotnet run --project desktop/windows/control-panel-layout-tests/AgentDock.ControlPanel.LayoutTests.csproj -c Release -- $PWD (Join-Path $PWD 'dist/layout-validation') 2>&1 | Tee-Object -FilePath dist/wb03/layout.log
          if ($LASTEXITCODE -ne 0) { throw 'Offscreen WPF insertion validation failed' }
      - name: Record immutable evidence
        if: always()
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne '${{ needs.source.outputs.commit }}') { throw 'Checked-out commit differs from immutable source job' }
          @{lane='WB03-insertion';commit=$commit;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;runner='windows-desktop';production_touched=$false;package_published=$false} | ConvertTo-Json | Set-Content dist/wb03/evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wb03-insertion-desktop-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/wb03/*
            dist/layout-validation/layout-validation.json
          if-no-files-found: warn
          retention-days: 30
