name: WB02 Permission Candidate

on:
  push:
    branches:
      - parallel/20260925/permissions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb02-permissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve immutable WB02 source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record immutable source identity
        id: identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$commit" = "$EXPECTED_COMMIT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p dist/wb02-source
          printf '{"lane":"WB02","commit":"%s","repository":"%s","ref":"%s","run_id":"%s","run_attempt":"%s","production_touched":false,"published":false}\n' \
            "$commit" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/wb02-source/source.json
      - name: Upload source identity
        uses: actions/upload-artifact@v7
        with:
          name: wb02-source-${{ steps.identity.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wb02-source/source.json
          if-no-files-found: error
          retention-days: 30

  go-validation:
    needs: source
    name: Permission core and HTTP regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Record runner metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p dist/wb02-go
          {
            printf 'lane=WB02\ncommit=%s\nrepository=%s\nref=%s\nrun_id=%s\nrun_attempt=%s\nrunner_os=%s\nrunner_arch=%s\n' \
              "$EXPECTED_COMMIT" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH"
            go version
            go env GOOS GOARCH
          } > dist/wb02-go/environment.txt
      - name: Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" | tee dist/wb02-go/format.txt
            exit 1
          fi
          printf 'gofmt=passed\n' | tee dist/wb02-go/format.txt
      - name: Permission, runtime and HTTP regression
        shell: bash
        run: |
          set -euo pipefail
          go test -json -p 2 ./internal/permission ./internal/app ./internal/httpx -count=1 -timeout=8m 2>&1 | tee dist/wb02-go/tests.jsonl
      - name: Permission concurrency regression
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json ./internal/permission -count=1 -timeout=4m 2>&1 | tee dist/wb02-go/race.jsonl
      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/permission ./internal/app ./internal/httpx 2>&1 | tee dist/wb02-go/vet.txt
      - name: Build core without starting it
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o dist/wb02-go/agentdock ./cmd/agentdock 2>&1 | tee dist/wb02-go/build.txt
      - name: Record successful validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git diff --exit-code
          printf '{"lane":"WB02","commit":"%s","go_tests":"passed","race":"passed","vet":"passed","core_build":"passed","production_touched":false,"published":false}\n' \
            "$EXPECTED_COMMIT" > dist/wb02-go/result.json
      - name: Upload Go validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb02-go-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wb02-go
          if-no-files-found: warn
          retention-days: 30

  windows-candidate:
    needs: [source, go-validation]
    name: Windows editor regression and candidate
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
      CGO_ENABLED: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Record runner metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($commit -ne $env:EXPECTED_COMMIT) { throw 'Windows checkout does not match the validated SHA.' }
          New-Item -ItemType Directory -Force dist/wb02-windows, dist/wb02-candidate | Out-Null
          @(
            "lane=WB02"
            "commit=$commit"
            "repository=$env:GITHUB_REPOSITORY"
            "ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            (& go version)
            (& dotnet --version)
          ) | Set-Content -Encoding utf8 dist/wb02-windows/environment.txt
      - name: Windows permission regression
        run: |
          $ErrorActionPreference = 'Stop'
          & go test -json -p 1 ./internal/permission ./internal/app ./internal/httpx -count=1 -timeout=8m 2>&1 | Tee-Object -FilePath dist/wb02-windows/go-tests.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go permission regression failed.' }
      - name: Pure desktop permission contracts
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet run --project desktop/windows/control-panel-tests/AgentDock.ControlPanel.Tests.csproj --configuration Release 2>&1 | Tee-Object -FilePath dist/wb02-windows/desktop-policy.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pure desktop permission contracts failed.' }
      - name: Offscreen WPF permission editor contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $layout = Join-Path $PWD 'dist/wb02-layout'
          & dotnet run --project desktop/windows/control-panel-layout-tests/AgentDock.ControlPanel.LayoutTests.csproj --configuration Release -- $PWD $layout 2>&1 | Tee-Object -FilePath dist/wb02-windows/layout.txt
          if ($LASTEXITCODE -ne 0) { throw 'Offscreen WPF permission editor contracts failed.' }
      - name: Build unsigned Windows candidate without installing
        run: |
          $ErrorActionPreference = 'Stop'
          & go build -trimpath -o dist/wb02-candidate/agentdock.exe ./cmd/agentdock 2>&1 | Tee-Object -FilePath dist/wb02-windows/core-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows core build failed.' }
          & dotnet publish desktop/windows/control-panel/AgentDock.ControlPanel.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/wb02-candidate/control-panel 2>&1 | Tee-Object -FilePath dist/wb02-windows/control-panel-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows control panel build failed.' }
          Copy-Item docs/permissions-custom-settings.md dist/wb02-candidate/permissions-custom-settings.md
      - name: Package candidate and evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($commit -ne $env:EXPECTED_COMMIT) { throw 'Candidate source identity changed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source.' }
          $metadata = [ordered]@{
            lane = 'WB02'
            commit = $commit
            platform = 'windows/x64'
            go_tests = 'passed'
            desktop_policy = 'passed'
            wpf_layout = 'passed'
            candidate_build = 'passed'
            installer_run = 'not_run'
            production_touched = $false
            published = $false
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 dist/wb02-candidate/candidate.json
          $short = $commit.Substring(0, 12)
          $archive = "dist/wb02-permissions-windows-$short.zip"
          Compress-Archive -Path dist/wb02-candidate/* -DestinationPath $archive -CompressionLevel Optimal
          Copy-Item dist/wb02-candidate/candidate.json dist/wb02-windows/result.json
      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: wb02-windows-candidate-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/wb02-permissions-windows-*.zip
            dist/wb02-candidate/candidate.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wb02-windows-evidence-${{ needs.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/wb02-windows
            dist/wb02-layout
          if-no-files-found: warn
          retention-days: 30
