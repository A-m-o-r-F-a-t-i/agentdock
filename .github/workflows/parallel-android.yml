name: WB07 Android Candidate

on:
  push:
    branches: ["parallel/20260925/android"]

permissions:
  contents: read

concurrency:
  group: wb07-android-${{ github.ref }}
  cancel-in-progress: false

env:
  WB07_BASE_SHA: b367eaab95202873fb213b8713440bf7822878c4
  GRADLE_VERSION: 9.4.1
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: 37.0.0

jobs:
  contract:
    name: Source and bridge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      short_sha: ${{ steps.identity.outputs.short_sha }}
      product_version: ${{ steps.identity.outputs.product_version }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          short_sha="${GITHUB_SHA:0:12}"
          product_version="$(sed -n 's/^[[:space:]]*const Version = "\([^"]*\)"/\1/p' internal/buildinfo/buildinfo.go)"
          test -n "$product_version"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "product_version=$product_version" >> "$GITHUB_OUTPUT"
          mkdir -p evidence/contract
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path("evidence/contract/identity.json").write_text(json.dumps({
              "schema_version": 1,
              "lane": "WB07",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "checkout_exact": True,
              "publication": False,
              "production_modified": False
          }, indent=2) + "\n")
          PY

      - name: Enforce owned paths
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$WB07_BASE_SHA^{commit}"
          changed="$(git diff --name-only "$WB07_BASE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$changed" | tee evidence/contract/changed-files.txt
          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(mobile/android/|scripts/ci/parallel-android/|docs/android/|\.github/workflows/parallel-android\.yml$)' || true)"
          test -z "$disallowed" || { printf 'WB07 path violation:\n%s\n' "$disallowed" >&2; exit 1; }

      - name: Validate source and bridge contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("mobile/android/app/src/main").rglob("*.xml"))
          if not files:
              raise SystemExit("no Android XML resources found")
          for path in files:
              ET.parse(path)
          print(f"parsed {len(files)} Android XML files")
          PY
          sh -n mobile/android/termux/agentdock-workbench
          sh -n mobile/android/termux/agentdock-workbench-bootstrap.sh
          bash -n scripts/ci/parallel-android/test-termux-bridge.sh
          bash -n scripts/ci/parallel-android/run-emulator-tests.sh
          bash scripts/ci/parallel-android/test-termux-bridge.sh | tee evidence/contract/termux-contract.txt
          git diff --check "$WB07_BASE_SHA" "$GITHUB_SHA"

      - name: Validate security and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.product_version }}"
          grep -F 'rootProject.file("../../internal/buildinfo/buildinfo.go")' mobile/android/app/build.gradle.kts
          grep -F 'compileSdk = 37' mobile/android/app/build.gradle.kts
          grep -F 'targetSdk = 37' mobile/android/app/build.gradle.kts
          grep -F 'minSdk = 26' mobile/android/app/build.gradle.kts
          grep -F 'customPermissionEnabled: Boolean = false' mobile/android/app/src/main/java/dev/agentdock/workbench/model/WorkbenchModels.kt
          grep -F 'desiredNodeState: String = "stopped"' mobile/android/app/src/main/java/dev/agentdock/workbench/model/WorkbenchModels.kt
          test "$version" = "$(sed -n 's/^[[:space:]]*const Version = "\([^"]*\)"/\1/p' internal/buildinfo/buildinfo.go)"
          if grep -RInE --exclude='Pages.kt' \
            'BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW|android\.permission\.WAKE_LOCK|Shizuku|(^|[^A-Za-z])su[[:space:]]+-c|adb[[:space:]]+shell|MediaPlayer|AudioTrack|setExactAndAllowWhileIdle' \
            mobile/android/app/src/main mobile/android/termux; then
            echo "forbidden Android elevation/background mechanism found" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/parallel-android.yml").read_text()
          sensitive_permission = "contents" + ": " + "write"
          if sensitive_permission in text:
              raise SystemExit(f"forbidden workflow permission found: {sensitive_permission}")
          forbidden = ["gh" + " release", "git" + " tag", "npm" + " publish", "gradle" + " publish"]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"publication commands found: {hits}")
          PY

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb07-android-contract-${{ steps.identity.outputs.short_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/contract
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Android lint, unit tests and APKs
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate_artifact: ${{ steps.identity.outputs.candidate_artifact }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          artifact="wb07-android-apk-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test-signed"
          echo "candidate_artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            for candidate in \
              "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "$sdk_root/cmdline-tools/bin/sdkmanager" \
              "$sdk_root/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                sdkmanager_path="$candidate"
                break
              fi
            done
          fi
          test -x "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          platform="$sdk_root/platforms/android-${ANDROID_COMPILE_SDK}"
          if [[ ! -d "$platform" ]]; then
            candidate="$sdk_root/platforms/android-${ANDROID_COMPILE_SDK}.0"
            if [[ ! -d "$candidate" ]]; then
              candidate="$(find "$sdk_root/platforms" -maxdepth 1 -type d -name "android-${ANDROID_COMPILE_SDK}.*" ! -name '*beta*' | sort -V | head -1)"
            fi
            test -n "$candidate"
            test -d "$candidate"
            relative="$(basename "$candidate")"
            ln -s "$relative" "$platform" 2>/dev/null || sudo ln -s "$relative" "$platform"
          fi
          test -d "$platform"
          test -d "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$sdk_root/platform-tools/adb"
          printf 'platform=%s\nbuild_tools=%s\n' "$platform" "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Lint, unit test and build APKs
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((101070000 + GITHUB_RUN_NUMBER))
          mkdir -p evidence/build
          gradle -p mobile/android --no-daemon --stacktrace --warning-mode all \
            lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest \
            -PagentdockAndroidVersionCode="$version_code" \
            -PagentdockCandidateSha="$GITHUB_SHA" \
            -PagentdockCandidateRunId="$GITHUB_RUN_ID" \
            -PagentdockCandidateRunAttempt="$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee evidence/build/gradle.log

      - name: Stage test-signed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          version="${{ needs.contract.outputs.product_version }}"
          out="evidence/build/apk"
          mkdir -p "$out" evidence/build/signing
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$out/AgentDock-Workbench-${version}-Android-debug-${short_sha}-test-signed.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$out/AgentDock-Workbench-${version}-Android-release-shaped-${short_sha}-test-signed.apk"
          cp mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$out/AgentDock-Workbench-${version}-Android-instrumentation-${short_sha}-test-signed.apk"
          (cd "$out" && sha256sum *.apk | sort > SHA256SUMS)
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          for apk in "$out"/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" >"evidence/build/signing/$(basename "$apk").txt"
          done
          VERSION="$version" SHORT_SHA="$short_sha" VERSION_CODE=$((101070000 + GITHUB_RUN_NUMBER)) python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("evidence/build")
          (root / "candidate.json").write_text(json.dumps({
              "schema_version": 1,
              "lane": "WB07",
              "product": "AgentDock Workbench",
              "product_version": os.environ["VERSION"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "signing": "Android debug/test key only",
              "publication": False,
              "production_modified": False,
              "apks": sorted(path.name for path in (root / "apk").glob("*.apk"))
          }, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Collect build reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/build/reports
          for source in \
            mobile/android/app/build/reports/lint-results-debug.html \
            mobile/android/app/build/reports/lint-results-debug.xml \
            mobile/android/app/build/reports/tests/testDebugUnitTest \
            mobile/android/app/build/test-results/testDebugUnitTest; do
            [[ ! -e "$source" ]] || cp -a "$source" evidence/build/reports/
          done
          env | grep -E '^(GITHUB_SHA|GITHUB_RUN_ID|GITHUB_RUN_ATTEMPT|RUNNER_OS|RUNNER_ARCH)=' | sort > evidence/build/environment.txt

      - name: Upload APK candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.candidate_artifact }}
          path: |
            evidence/build/apk
            evidence/build/signing
            evidence/build/candidate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb07-android-build-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/build
          if-no-files-found: warn
          retention-days: 14

  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: [contract, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 37]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "evidence/emulator-api-${{ matrix.api }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            for candidate in \
              "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "$sdk_root/cmdline-tools/bin/sdkmanager" \
              "$sdk_root/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                sdkmanager_path="$candidate"
                break
              fi
            done
          fi
          test -x "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          platform="$sdk_root/platforms/android-${ANDROID_COMPILE_SDK}"
          if [[ ! -d "$platform" ]]; then
            candidate="$sdk_root/platforms/android-${ANDROID_COMPILE_SDK}.0"
            if [[ ! -d "$candidate" ]]; then
              candidate="$(find "$sdk_root/platforms" -maxdepth 1 -type d -name "android-${ANDROID_COMPILE_SDK}.*" ! -name '*beta*' | sort -V | head -1)"
            fi
            test -n "$candidate"
            test -d "$candidate"
            relative="$(basename "$candidate")"
            ln -s "$relative" "$platform" 2>/dev/null || sudo ln -s "$relative" "$platform"
          fi
          test -d "$platform"
          test -d "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$sdk_root/platform-tools/adb"
          printf 'platform=%s\nbuild_tools=%s\n' "$platform" "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Enable KVM access
        shell: bash
        run: |
          [[ ! -e /dev/kvm ]] || sudo chmod 666 /dev/kvm

      - name: Run Compose navigation and screenshot tests
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          ANDROID_API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 6000M
          script: bash scripts/ci/parallel-android/run-emulator-tests.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb07-android-api${{ matrix.api }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/emulator-api-${{ matrix.api }}
          if-no-files-found: warn
          retention-days: 14

  evidence:
    name: Aggregate candidate evidence
    if: always()
    needs: [contract, build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write explicit evidence summary
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
          CANDIDATE_ARTIFACT: ${{ needs.build.outputs.candidate_artifact }}
          PRODUCT_VERSION: ${{ needs.contract.outputs.product_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence/summary
          python3 - <<'PY'
          import json, os, pathlib
          summary = {
              "schema_version": 1,
              "lane": "WB07",
              "product": "AgentDock Workbench",
              "product_version": os.environ.get("PRODUCT_VERSION", ""),
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "jobs": {
                  "contract": os.environ.get("CONTRACT_RESULT", "unknown"),
                  "build": os.environ.get("BUILD_RESULT", "unknown"),
                  "emulator_api_33_34_35_37_matrix": os.environ.get("EMULATOR_RESULT", "unknown")
              },
              "candidate_artifact": os.environ.get("CANDIDATE_ARTIFACT", ""),
              "signing": "test-signed with Android debug key; not production signing evidence",
              "emulator_scope": "x86_64 navigation/layout and Android API compatibility",
              "physical_arm64_termux": "not run; shell contract only",
              "signed_linux_arm64_manifest": "pending WB05 release contract",
              "duration_runs": {"30_minutes": "not run", "2_hours": "not run", "8_hours": "not run"},
              "merge": False,
              "tag": False,
              "release": False,
              "publication": False,
              "production_modified": False
          }
          pathlib.Path("evidence/summary/evidence.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n")
          pathlib.Path("evidence/summary/README.txt").write_text(
              "WB07 candidate evidence only. No merge, tag, release, publication, production mutation, or production signing occurred.\n"
          )
          PY

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb07-android-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/summary
          if-no-files-found: error
          retention-days: 14
