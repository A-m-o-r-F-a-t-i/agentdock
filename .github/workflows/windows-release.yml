name: Windows Release

on:
  push:
    branches: [feat/tailscale-funnel, release/windows-1.1.1, feat/conversation-execution-center]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Windows assets after every validation step passes'
        type: boolean
        default: false
      prerelease:
        description: 'Preview is required until real ChatGPT and production acceptance gates are recorded'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository_id == '1370391430'
    name: Windows build and lifecycle verification
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify source and version
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files '*.go')
          $unformatted = @(& gofmt -l $files)
          if ($unformatted.Count) { throw "Unformatted Go: $($unformatted -join ', ')" }
          $version = (& go run ./tools/release version).Trim()
          go run ./tools/release verify-version "v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed.' }
      - name: Backend full regression
        run: |
          $ErrorActionPreference = 'Stop'
          # Bound simultaneous process-heavy packages on hosted Windows runners.
          # Keep all test cases, assertions and individual operation deadlines.
          go test -json -p 2 ./... -count=1 -timeout=8m | Tee-Object (Join-Path $env:RUNNER_TEMP 'execution-go.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed.' }
      - name: Static analysis
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed.' }
      - name: Windows installer contracts
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-install-windows.ps1
      - name: Compile Windows x64 and ARM64 releases
        run: |
          $ErrorActionPreference = 'Stop'
          & .\packaging\windows\build-windows-release.ps1 -Candidate
      - name: Tailscale install repair rollback and uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'fake-tailscale.exe'
          go build -o $fake ./scripts/test/testdata/fake-tailscale
          if ($LASTEXITCODE -ne 0) { throw 'Fake Tailscale build failed.' }
          $expectedVersion = (& go run ./tools/release version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the Funnel test target version.' }
          & .\scripts\test\test-windows-tailscale-funnel-lifecycle.ps1 `
            -ExpectedVersion $expectedVersion `
            -Archive .\dist\windows-release\release\agentdock_windows_amd64.zip `
            -FakeTailscaleBinary $fake `
            -ReportRoot (Join-Path $env:RUNNER_TEMP 'tailscale-installer-e2e')
      - name: Activity desktop and native recovery regressions
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-activity-center.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'activity-ui')
          & .\scripts\test\test-windows-activity-runtime.ps1 `
            -CoreBinary .\dist\windows-release\payload-amd64\agentdock.exe `
            -TestRoot (Join-Path $env:RUNNER_TEMP 'activity-native')
      - name: Execution policy compatibility with actual 1.1.1 Core
        run: |
          $ErrorActionPreference = 'Stop'
          $legacySource = Join-Path $env:RUNNER_TEMP 'execution-legacy-source'
          $legacyPayload = Join-Path $env:RUNNER_TEMP 'execution-legacy-payload'
          $sourceZip = Join-Path $env:RUNNER_TEMP 'execution-legacy-source.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'execution-legacy-core.zip'
          git archive --format=zip --output=$sourceZip 7505e8044c6daa78ed73c603a2dd9ff214883d82
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the immutable 1.1.1 fixture source.' }
          Expand-Archive $sourceZip $legacySource
          New-Item -ItemType Directory -Path $legacyPayload | Out-Null
          go -C $legacySource build -o (Join-Path $legacyPayload 'agentdock.exe') ./cmd/agentdock
          if ($LASTEXITCODE -ne 0) { throw 'Legacy Core fixture build failed.' }
          Compress-Archive (Join-Path $legacyPayload 'agentdock.exe') $archive
          ((Get-FileHash $archive).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($archive)) | Set-Content ($archive + '.sha256') -Encoding ascii
          & .\scripts\test\test-windows-execution-compatibility.ps1 `
            -CoreBinary .\dist\windows-release\payload-amd64\agentdock.exe `
            -ShimBinary .\dist\windows-release\payload-amd64\agentdock-shim.exe `
            -LegacyArchive $archive -TestRoot (Join-Path $env:RUNNER_TEMP 'execution-compatibility')
      - name: Cloudflare Quick regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'fake-cloudflared.exe'
          go build -o $fake ./scripts/test/testdata/fake-cloudflared
          if ($LASTEXITCODE -ne 0) { throw 'Fake cloudflared build failed.' }
          & .\scripts\test\test-windows-quick-tunnel-lifecycle.ps1 `
            -InstallerPath .\scripts\install\install.ps1 `
            -UninstallerPath .\scripts\install\uninstall-windows.ps1 `
            -AgentDockArchive .\dist\windows-release\release\agentdock_windows_amd64.zip `
            -AgentDockChecksumFile .\dist\windows-release\release\agentdock_windows_amd64.zip.sha256 `
            -FakeCloudflaredBinary $fake
      - name: Cloudflare Named upgrade and rollback regression
        run: |
          $ErrorActionPreference = 'Stop'
          function Build-OverlayCore([string]$Version, [string]$Output) {
            $sourcePath = (Resolve-Path './internal/buildinfo/buildinfo.go').Path
            $source = [IO.File]::ReadAllText($sourcePath)
            $replacement = [regex]::Replace($source, 'const Version = "[^"]+"', ('const Version = "' + $Version + '"'), 1)
            if ($source -eq $replacement) { throw 'Version overlay was not generated.' }
            $replacementPath = Join-Path $env:RUNNER_TEMP "buildinfo-$Version.go"
            $overlayPath = Join-Path $env:RUNNER_TEMP "buildinfo-$Version.json"
            [IO.File]::WriteAllText($replacementPath, $replacement)
            $mapping = @{}; $mapping[$sourcePath] = $replacementPath
            @{Replace=$mapping} | ConvertTo-Json | Set-Content $overlayPath -Encoding utf8NoBOM
            go build -overlay $overlayPath -o $Output ./cmd/agentdock
            if ($LASTEXITCODE -ne 0) { throw 'Versioned Core build failed.' }
          }
          $source = Join-Path $env:RUNNER_TEMP 'agentdock-named-source.exe'
          $trial = Join-Path $env:RUNNER_TEMP 'agentdock-named-trial.exe'
          Build-OverlayCore '0.0.0-named-source-e2e' $source
          Build-OverlayCore '999.0.0-named-trial-e2e' $trial
          & .\scripts\test\test-windows-named-tunnel-lifecycle.ps1 `
            -InstallerPath .\scripts\install\install.ps1 `
            -UninstallerPath .\scripts\install\uninstall-windows.ps1 `
            -TargetAgentDockArchive .\dist\windows-release\release\agentdock_windows_amd64.zip `
            -TargetAgentDockChecksumFile .\dist\windows-release\release\agentdock_windows_amd64.zip.sha256 `
            -SourceCoreBinary $source -TrialCoreBinary $trial `
            -FakeCloudflaredBinary (Join-Path $env:RUNNER_TEMP 'fake-cloudflared.exe')
      - name: Verify offline Setup installation and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-e2e.ps1 `
            -SetupPath .\dist\windows-release\release\AgentDockSetup-amd64.exe `
            -LegacyCorePath .\dist\windows-release\payload-amd64\agentdock.exe `
            -LegacyTrayPath .\dist\windows-release\payload-amd64\agentdock-tray.exe `
            -AllowLegacyTaskMutation
      - name: Verify release checksums and source cleanliness
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem ./dist/windows-release/release -Filter '*.sha256' | ForEach-Object {
            $parts = ([IO.File]::ReadAllText($_.FullName).Trim() -split '\s+', 2)
            $asset = Join-Path $_.DirectoryName $parts[1]
            if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) { throw "Asset checksum mismatch: $asset" }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source.' }
      - name: Upload verified Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: agentdock-windows-release
          path: dist/windows-release/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-verification
          path: |
            dist/windows-release/build-report.json
            ${{ runner.temp }}/tailscale-installer-e2e/result.json
            ${{ runner.temp }}/tailscale-installer-e2e/funnel-rollback.log
            ${{ runner.temp }}/activity-ui/result.json
            ${{ runner.temp }}/activity-ui/render/*.png
            ${{ runner.temp }}/activity-native/result.json
            ${{ runner.temp }}/execution-compatibility/result.json
            ${{ runner.temp }}/execution-go.jsonl
          if-no-files-found: ignore

  windows-arm64:
    if: github.repository_id == '1370391430'
    name: Native Windows ARM64 verification
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: arm64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify native ARM64 runtime and backend
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'ARM64 OS required.' }
          if ((go env GOARCH).Trim() -ne 'arm64') { throw 'Native ARM64 Go toolchain required.' }
          go test -json -p 2 ./... -count=1 -timeout=8m | Tee-Object (Join-Path $env:RUNNER_TEMP 'arm64-go.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Go tests failed.' }
          go build -o (Join-Path $env:RUNNER_TEMP 'agentdock-arm64.exe') ./cmd/agentdock
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Core build failed.' }
          & .\scripts\test\test-windows-activity-runtime.ps1 -CoreBinary (Join-Path $env:RUNNER_TEMP 'agentdock-arm64.exe') -TestRoot (Join-Path $env:RUNNER_TEMP 'arm64-native')
      - name: Verify native ARM64 WPF window
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-activity-center.ps1 -RuntimeIdentifier win-arm64 -TestRoot (Join-Path $env:RUNNER_TEMP 'arm64-ui')
      - name: Upload native ARM64 verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-verification
          path: |
            ${{ runner.temp }}/arm64-go.jsonl
            ${{ runner.temp }}/arm64-native/result.json
            ${{ runner.temp }}/arm64-ui/result.json
            ${{ runner.temp }}/arm64-ui/execution-render/*.png
          if-no-files-found: ignore

  windows-arm64-install:
    if: github.repository_id == '1370391430'
    name: Native Windows ARM64 installation
    needs: [windows, windows-arm64]
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: agentdock-windows-release
          path: dist/windows-release/release
      - name: Install repair and uninstall the verified ARM64 package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'ARM64 OS required.' }
          $release = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-release\release'
          foreach ($name in @('AgentDockSetup-arm64.exe','agentdock_windows_arm64.zip')) {
            $file = Join-Path $release $name
            $expected = ((Get-Content ($file+'.sha256') -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $file).Hash.ToLowerInvariant() -ne $expected) { throw 'ARM64 package checksum mismatch.' }
          }
          $payload = Join-Path $env:RUNNER_TEMP 'arm64-install-payload'
          Expand-Archive (Join-Path $release 'agentdock_windows_arm64.zip') $payload
          $version = & (Join-Path $payload 'agentdock.exe') version --json | ConvertFrom-Json
          if ($version.platform -ne 'windows/arm64') { throw 'Native ARM64 Core required.' }
          $report = @{passed=$false; core=$version; runner_architecture='arm64'; production_touched=$false}
          try {
            & .\scripts\test\test-windows-setup-e2e.ps1 `
              -SetupPath (Join-Path $release 'AgentDockSetup-arm64.exe') `
              -LegacyCorePath (Join-Path $payload 'agentdock.exe') `
              -LegacyTrayPath (Join-Path $payload 'agentdock-tray.exe') -AllowLegacyTaskMutation
            $report.passed = $true
            $report.scope = 'Native ARM64 Setup install, in-place repair, service lifecycle, legacy task migration and uninstall'
          } finally {
            $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:RUNNER_TEMP 'arm64-install-result.json') -Encoding utf8
          }
      - name: Upload native ARM64 installation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-install-verification
          path: ${{ runner.temp }}/arm64-install-result.json
          if-no-files-found: ignore

  publish:
    name: Publish only this fork's Windows assets
    needs: [windows, windows-arm64, windows-arm64-install]
    if: github.repository_id == '1370391430' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: agentdock-windows-release
          path: dist/windows-release/release
      - name: Publish immutable verified Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& go run ./tools/release version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve candidate version.' }
          $tag = "v$version"
          if ($version -eq '1.1.2') {
            go run ./tools/release verify-acceptance ./docs/releases/v1.1.2-acceptance.json
            if ($LASTEXITCODE -ne 0) { throw '1.1.2 publication remains blocked by acceptance.' }
          }
          # The immutable 1.1.0 base already contains both feature integrations.
          # Do not compare against mutable development branch tips.
          git fetch --unshallow origin
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read complete integration history.' }
          git fetch origin refs/tags/v1.1.0:refs/tags/v1.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the 1.1.0 release base.' }
          git merge-base --is-ancestor v1.1.0 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The repaired release does not include 1.1.0.' }
          if ($version -eq '1.1.1' -and $env:PRERELEASE -ne 'true') {
            $acceptance = Get-Content ./docs/releases/v1.1.1-acceptance.json -Raw | ConvertFrom-Json
            if (-not $acceptance.real_chatgpt_oauth_and_tools -or -not $acceptance.real_chatgpt_refresh_reconnect -or -not $acceptance.production_configuration_preserved) {
              throw 'Formal release blocked: real-client and production acceptance is incomplete. Publish a preview only.'
            }
          }
          $directory = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-release\release'
          $expected = @('AgentDockSetup-amd64.exe','AgentDockSetup-arm64.exe','agentdock_windows_amd64.zip','agentdock_windows_arm64.zip','install.ps1')
          foreach ($name in $expected) {
            $path = Join-Path $directory $name
            $checksum = ((Get-Content "$path.sha256" -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) { throw "Checksum mismatch: $name" }
          }
          $assets = @(Get-ChildItem $directory -File)
          if ($assets.Count -ne 10) { throw 'Unexpected release asset set.' }
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or $existing) { throw 'The immutable tag exists or cannot be inspected.' }
          # GITHUB_TOKEN-created tags do not trigger another push workflow.
          gh release create $tag @($assets.FullName) --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "AgentDock $version for Windows" --notes-file "./docs/releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          $remote = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $remote.assets.Count -ne 10) { throw 'Remote asset verification failed; draft retained.' }
          if ($env:PRERELEASE -eq 'true') {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed.' }
